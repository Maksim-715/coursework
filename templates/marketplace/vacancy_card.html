<article class="card"><div class="card-topline"><span class="company-avatar">{{ item.company.name|first }}</span><span class="badge {% if item.kind == 'day' %}green{% endif %}">{{ item.get_kind_display }}</span></div><div class="muted">{{ item.company.name }}</div><h3><a href="{% url 'detail' 'vacancies' item.pk %}">{{ item.title }}</a></h3><div class="price">{{ item.salary }} ₽ <small>/ {% if item.kind == 'day' %}смена{% else %}месяц{% endif %}</small></div><p>{{ item.format }}</p><a class="card-link" href="{% url 'detail' 'vacancies' item.pk %}">Подробнее <span>↗</span></a></article>
