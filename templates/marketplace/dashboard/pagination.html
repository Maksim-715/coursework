{% if items.has_other_pages %}<nav class="pagination" aria-label="Страницы раздела"><span>Всего: {{ items.paginator.count }}</span>{% if items.has_previous %}<a href="?{{ items.query_string }}&{{ items.page_key }}={{ items.previous_page_number }}#{{ items.anchor }}">← Назад</a>{% endif %}<span>{{ items.number }} / {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a href="?{{ items.query_string }}&{{ items.page_key }}={{ items.next_page_number }}#{{ items.anchor }}">Далее →</a>{% endif %}</nav>{% endif %}
